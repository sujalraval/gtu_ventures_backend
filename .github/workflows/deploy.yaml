name: Deploy to VPS

on:
  push:
    branches: [ dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Backend
        uses: actions/checkout@v4
        with:
          path: backend

      - name: Checkout Frontend
        uses: actions/checkout@v4
        with:
          repository: Datarsoft/gusec1
          path: frontend
          ref: dev # pulling from dev branch
          token: ${{ secrets.GH_PATH || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            ./backend/package-lock.json
            ./frontend/package-lock.json

      - name: Install & Build Frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: https://apply.datarsoft.tech/api
        run: |
          npm install
          npm run build

      - name: Prepare Backend
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: |
          mkdir -p public
          cp -r ../frontend/dist/* ./public/
          npm install
          npx prisma generate
          npm run build

      - name: Debug Connectivity
        run: |
          echo "Checking connectivity to VPS (82.112.226.201) on port 22..."
          nc -zv -w 5 82.112.226.201 22 || (echo "❌ Port 22 is NOT reachable from the runner IP. Please check VPS firewall/UFW." && exit 1)

      - name: Deploy to VPS
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "backend/"
          REMOTE_HOST: 82.112.226.201
          REMOTE_USER: datarsoft-apply
          TARGET: "/home/datarsoft-apply/htdocs/apply.datarsoft.tech"
          EXCLUDE: "/node_modules/, /.git/, /.env"

      - name: Post Deployment Script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 82.112.226.201
          username: datarsoft-apply
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Load NVM and node environment
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              \. "$NVM_DIR/nvm.sh"
              nvm use default || nvm use node || true
            fi
            
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin
            
            cd /home/datarsoft-apply/htdocs/apply.datarsoft.tech

            # Create/Update .env file from secrets
            cat <<'EOF' > .env
            PORT=${{ secrets.PORT || '3000' }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            NODE_ENV=production
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN || '15m' }}
            REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_SECRET }}
            REFRESH_TOKEN_EXPIRES_IN=${{ secrets.REFRESH_TOKEN_EXPIRES_IN || '30d' }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT || '587' }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}
            ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS || 'https://apply.datarsoft.tech' }}
            EOF

            which pm2 || npm install -g pm2

            npm install
            npx prisma generate

            # Run pending migrations safely — never use db push in production
            npx prisma migrate deploy

            # Start/Reload with PM2
            pm2 reload ecosystem.config.js --env production || pm2 start ecosystem.config.js --env production
