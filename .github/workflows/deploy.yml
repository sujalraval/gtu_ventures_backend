name: Deploy to VPS

on:
  push:
    branches: [ main, master, dev ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Backend
        uses: actions/checkout@v4
        with:
          path: backend

      - name: Checkout Frontend
        uses: actions/checkout@v4
        with:
          repository: sujalraval/gtu_ventures_frontend
          path: frontend
          ref: main
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            ./backend/package-lock.json
            ./frontend/package-lock.json

      - name: Install & Build Frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: https://apply.gtuventures.com/api
        run: |
          npm install
          npm run build

      - name: Prepare Backend
        working-directory: ./backend
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
        run: |
          mkdir -p public
          cp -r ../frontend/dist/* ./public/
          npm install
          npx prisma generate
          npm run build

      - name: Debug Connectivity
        run: |
          echo "Checking connectivity to VPS (82.112.226.201) on port 22..."
          nc -zv -w 5 82.112.226.201 22 || (echo "?O Port 22 is NOT reachable from the runner IP. Please check VPS firewall/UFW." && exit 1)

      - name: Deploy to VPS
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "backend/"
          REMOTE_HOST: 82.112.226.201
          REMOTE_USER: gtuventures-apply
          TARGET: "/home/gtuventures-apply/htdocs/gtuventures_bck_prod"
          # /uploads/ is gitignored, so it is never in SOURCE — and rsync runs
          # with --delete. Without this exclusion every deploy wipes every file
          # users have uploaded: pitch decks, ID proofs, logos, signatures.
          EXCLUDE: "/node_modules/, /.git/, /.env, /uploads/"

      - name: Post Deployment Script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 82.112.226.201
          username: gtuventures-apply
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Without this the step's exit code comes from the LAST command only,
          # so a failed `prisma migrate deploy` still reported a green deploy.
          script_stop: true
          script: |
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              \. "$NVM_DIR/nvm.sh"
              nvm use default || nvm use node || true
            fi
            
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin
            
            cd /home/gtuventures-apply/htdocs/gtuventures_bck_prod

            cat <<'EOF' > .env
            PORT=${{ secrets.PORT || '5000' }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            NODE_ENV=production
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN || '15m' }}
            REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_SECRET }}
            REFRESH_TOKEN_EXPIRES_IN=${{ secrets.REFRESH_TOKEN_EXPIRES_IN || '30d' }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT || '587' }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            EMAIL_FROM=${{ secrets.EMAIL_FROM }}
            ALLOWED_ORIGINS=${{ secrets.ALLOWED_ORIGINS || 'https://apply.gtuventures.com' }}
            UPLOADS_DIR=${{ secrets.UPLOADS_DIR || '/home/gtuventures-apply/uploads' }}
            QUICK_EKYC_API_KEY=${{ secrets.QUICK_EKYC_API_KEY }}
            EOF

            # Lives outside the rsync target on purpose — see paths.ts.
            mkdir -p /home/gtuventures-apply/uploads

            which pm2 || npm install -g pm2

            npm install
            npx prisma generate
            npx prisma migrate deploy

            # Reload BY NAME. `pm2 reload dist/server.js` resolves by script
            # path, and with more than one app running the same script pm2 can
            # reload the wrong one — the deploy then goes green while the
            # process actually serving traffic keeps running the old build.
            pm2 reload gtuventures-backend-prod --update-env \
              || pm2 start dist/server.js --name gtuventures-backend-prod

            # Prove the new build is live rather than trusting the exit code.
            sleep 3
            pm2 describe gtuventures-backend-prod | grep -E "status|uptime" || true
